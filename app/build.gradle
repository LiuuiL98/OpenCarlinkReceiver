plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opencarlink.receiver'
    compileSdk 35

    defaultConfig {
        applicationId 'com.opencarlink.receiver'
        minSdk 19
        targetSdk 28
        versionCode 19
        versionName '0.2.6-dev.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
