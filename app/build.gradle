plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opencarlink.receiver'
    compileSdk 35

    defaultConfig {
        applicationId 'com.opencarlink.receiver'
        minSdk 19
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
